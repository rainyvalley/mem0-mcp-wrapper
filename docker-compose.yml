# mem0 REST API: batteries-included in this compose (see mem0 service below, built from
# mem0-server/). It's OUR wrapper code around the unpinned mem0ai library - mem0 itself
# is untouched. Prefer mem0's official OpenMemory stack instead? Comment this service out
# and set MEM0_URL to its API URL.

services:
  mem0-mcp:
    container_name: mem0-mcp
    build: ./mcp-server
    image: local/mem0-mcp:latest
    pull_policy: build
    environment:
      # Where the mem0 REST API lives (compose service name or LAN URL):
      - MEM0_URL=http://mem0:8000
      # MEM0_API_KEY comes from env_file — do NOT also set it via ${MEM0_API_KEY} here:
      # compose substitutes that from the HOST shell (often blank) and `environment:`
      # overrides `env_file`, silently blanking the key.
      - MEM0_DEFAULT_USER=              # empty = callers must pass explicit user ids
      # MEM0_ALLOW_WIPE_DEFAULT intentionally unset: delete_all_memories then refuses
      # to wipe the default user.
    env_file:
      - secrets.env           # MEM0_API_KEY + MCP_BEARER_TOKEN (MCP endpoint auth)
    ports:
      - "8300:8300"
    depends_on:
      - mem0
      - ollama
    # If your mem0 API is a compose service too, add it to depends_on.
    restart: unless-stopped
    # Optional memory hard cap (docker compose v2 syntax):
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M
    # NOTE: the MCP bearer (MCP_BEARER_TOKEN) lives in secrets.env; no/wrong token -> 401.

  # ── mem0 REST API (batteries included) ─────────────────────────────────
  # ~120-line FastAPI wrapper around the mem0 library exposing the 9 endpoints
  # the MCP wrapper expects. mem0ai is UNPINNED on purpose (mem0 is its own
  # fast-moving product). If you'd rather run mem0's official OpenMemory stack,
  # comment this service out and set MEM0_URL to its API URL:
  # https://docs.mem0.ai/openmemory/overview
  mem0:
    container_name: mem0
    build: ./mem0-server
    image: local/mem0:latest
    env_file:
      - secrets.env     # MEM0_API_KEY (+ optional OLLAMA_API_KEY for cloud extraction)
    environment:
      - OLLAMA_URL=http://ollama:11434
      - MEM0_EMBED_MODEL=nomic-embed-text
      - MEM0_EMBED_DIMS=768
      - QDRANT_HOST=qdrant
      - MEM0_HISTORY_DB=/data/history.db
    volumes:
      - mem0-data:/data
    ports:
      - "127.0.0.1:8000:8000"   # host-only by default; publish to LAN if OWUI is remote
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    # NOTE: qdrant has NO published ports - reachable only inside the compose network. Deliberate.

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    # GPU: uncomment for NVIDIA + install the NVIDIA container toolkit on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"   # LAN: lets Home Assistant / other boxes call Ollama directly
    restart: unless-stopped

volumes:
  mem0-data:
  qdrant-data:
  ollama-models: